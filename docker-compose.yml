# ============================================================
# CampusLink AI - Docker Compose 部署配置
# 一键启动: docker compose up -d
#
# 架构：浏览器 → Nginx(80) ─┬─ 静态文件（前端 SPA）
#                           └─ /api 反向代理 → FastAPI(8000，容器内网)
# ============================================================

services:
  # ==================== FastAPI 后端服务 ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: campuslink-backend
    # 对宿主机暴露 8000：便于直接访问 Swagger(/docs) 与 curl 调试
    # 若只允许通过 Nginx(80) 访问，可删除 ports 配置（容器间通信不受影响）
    ports:
      - "8000:8000"
    environment:
      # DeepSeek API 配置（读取项目根目录 .env，请修改为实际的 API Key）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-your_api_key_here}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - MODEL_NAME=${MODEL_NAME:-deepseek-chat}
    volumes:
      # 持久化数据卷
      - chroma_data:/app/chroma_db   # ChromaDB 向量数据
      - upload_data:/app/uploads     # 上传的文件
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Embedding 模型加载需要较长时间

  # ==================== Nginx 前端服务 ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: campuslink-frontend
    ports:
      # 宿主机访问端口，默认 80，可通过 .env 中 NGINX_PORT 修改（如 8080）
      - "${NGINX_PORT:-80}:80"
    # 调试用：如需查看 Nginx 访问日志，可取消注释下行
    # volumes:
    #   - ./docker/logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy  # 等后端健康后再启动
    restart: unless-stopped

# ==================== 数据卷 ====================
volumes:
  chroma_data:
    name: campuslink_chroma_data
    driver: local
  upload_data:
    name: campuslink_upload_data
    driver: local
