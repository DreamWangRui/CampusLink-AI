# ============================================================
# CampusLink AI - Docker Compose 部署配置
# 一键启动: docker compose up -d
# ============================================================

services:
  # ==================== CampusLink AI 服务 ====================
  campuslink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuslink-ai
    ports:
      - "8000:8000"
    environment:
      # DeepSeek API 配置（请修改为实际的 API Key）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-your_api_key_here}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - MODEL_NAME=${MODEL_NAME:-deepseek-chat}
    volumes:
      # 持久化数据卷
      - chroma_data:/app/chroma_db   # ChromaDB 向量数据
      - upload_data:/app/uploads     # 上传的文件
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Embedding 模型加载需要较长时间

# ==================== 数据卷 ====================
volumes:
  chroma_data:
    name: campuslink_chroma_data
    driver: local
  upload_data:
    name: campuslink_upload_data
    driver: local
