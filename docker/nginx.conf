# ============================================================
# CampusLink AI - Nginx 配置
# 职责：托管前端构建产物（SPA）+ 反向代理后端 API
# ============================================================

server {
    listen 80;
    server_name _;

    # ==================== 前端静态资源 ====================
    # 由 Dockerfile 的 frontend 构建阶段复制到该目录
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩（JS/CSS/SVG 等文本资源，显著减小传输体积）
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript \
               application/xml image/svg+xml;

    # Vite 构建产物带内容 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/、/knowledge 等前端路由全部回退到 index.html
    # index.html 不缓存：保证发版后浏览器能立即拿到新版本
    # （带 hash 的 /assets/ 已长缓存，见上）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ==================== 后端 API 反向代理 ====================
    # 注意：proxy_pass 不带末尾斜杠，保留原始 /api 前缀转发给 FastAPI
    location /api/ {
        proxy_pass http://backend:8000;

        # 透传真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 生成回答与批量文档向量化耗时较长，放宽超时（与前端 axios 超时对齐）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 允许批量上传大文件
        client_max_body_size 50m;
    }

    # Swagger API 文档透传（通过 80 端口即可访问 /docs）
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ==================== 健康检查端点（容器 healthcheck 用） ====================
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
