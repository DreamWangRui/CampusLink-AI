[project]
name = "campuslink-backend"
version = "0.1.0"
description = "CampusLink AI - 基于 RAG 的校园智能问答系统后端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.138.2",
    # 显式声明：1.21.0 存在 httpx 客户端被提前关闭的 bug（模型联网校验失败），
    # 导致 RAG 检索全链路报 "Cannot send a request, as the client has been closed."
    "huggingface-hub>=1.29.0",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001: API 边界统一兜底转换为 HTTPException 属有意设计
# B008: FastAPI 依赖注入 File()/Form() 作为参数默认值是官方标准写法
# DTZ005: 上传时间戳为本地展示用途，无时区需求
ignore = ["BLE001", "B008", "DTZ005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
